<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Royal Blue to Indigo Gradient -->
    <linearGradient id="eBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Cyan to Emerald Growth Arrow Gradient -->
    <linearGradient id="eGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gloss specular overlay -->
    <linearGradient id="eGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- PURE TRANSPARENT EMBLEM - NO BACKGROUND BOX OR FRAME -->
  <g filter="url(#emblemShadow)">
    
    <!-- Left Pillar of Letter "E" (Point-of-Sale Terminal Pillar) -->
    <path d="M128 96 C128 78, 142 64, 160 64 L224 64 C242 64, 256 78, 256 96 L256 416 C256 434, 242 448, 224 448 L160 448 C142 448, 128 434, 128 416 Z" fill="url(#eBlueGrad)" />
    <path d="M128 96 C128 78, 142 64, 160 64 L224 64 C242 64, 256 78, 256 96 L256 416 C256 434, 242 448, 224 448 L160 448 C142 448, 128 434, 128 416 Z" fill="url(#eGloss)" />

    <!-- Top Horizontal Arm of "E" -->
    <path d="M224 64 L368 64 C386 64, 400 78, 400 96 L400 128 C400 146, 386 160, 368 160 L224 160 Z" fill="url(#eBlueGrad)" />

    <!-- Middle Horizontal Arm of "E" -->
    <path d="M224 224 L336 224 C354 224, 368 238, 368 256 L368 272 C368 290, 354 304, 336 304 L224 304 Z" fill="url(#eBlueGrad)" />

    <!-- Bottom Horizontal Arm of "E" -->
    <path d="M224 352 L384 352 C402 352, 416 366, 416 384 L416 416 C416 434, 402 448, 384 448 L224 448 Z" fill="url(#eBlueGrad)" />

    <!-- OVERLAYING 3D POS GROWTH ARROW (E-Commerce + POS Sales Trend) -->
    <!-- Upward Trend Arrow Shaft -->
    <path d="M200 380 L312 264 L376 304 L448 160" fill="none" stroke="url(#eGreenGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Head -->
    <path d="M396 156 L464 148 L456 216 Z" fill="url(#eGreenGrad)" stroke="url(#eGreenGrad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Sparkle Node at Arrow Top -->
    <circle cx="456" cy="152" r="14" fill="#34D399" />
  </g>
</svg>

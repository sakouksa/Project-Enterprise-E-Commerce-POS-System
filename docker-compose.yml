version: '3.9'

services:
  # ─── PHP-FPM (Laravel) ───────────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise_pos_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - enterprise_pos_net
    depends_on:
      - app

  # ─── MySQL 8 ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: enterprise_pos_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: enterprise_pos
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - enterprise_pos_db_data:/var/lib/mysql
      - ./backend/docker/mysql.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - enterprise_pos_net

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - enterprise_pos_redis_data:/data
    networks:
      - enterprise_pos_net

  # ─── Queue Worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: enterprise_pos_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www
    networks:
      - enterprise_pos_net
    depends_on:
      - db
      - redis

  # ─── Admin Dashboard (React) ──────────────────────────────────────────────────
  admin:
    image: node:20-alpine
    container_name: enterprise_pos_admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5174:5174"
    volumes:
      - ./admin-dashboard:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - enterprise_pos_net

  # ─── Customer Website (React) ─────────────────────────────────────────────────
  website:
    image: node:20-alpine
    container_name: enterprise_pos_website
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./customer-website:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - enterprise_pos_net

networks:
  enterprise_pos_net:
    driver: bridge

volumes:
  enterprise_pos_db_data:
  enterprise_pos_redis_data:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Default SEO — overridden dynamically per page by react-helmet-async -->
    <title>NexTech Enterprise | Tech Store &amp; POS Cambodia</title>
    <meta name="description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://enterprise-pos-api.onrender.com/" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexTech Enterprise" />
    <meta property="og:title" content="NexTech Enterprise | Tech Store &amp; POS Cambodia" />
    <meta property="og:description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta property="og:image" content="https://enterprise-pos-api.onrender.com/logo.png" />
    <meta property="og:url" content="https://enterprise-pos-api.onrender.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexTech Enterprise | Tech Store &amp; POS Cambodia" />
    <meta name="twitter:description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta name="twitter:image" content="https://enterprise-pos-api.onrender.com/logo.png" />

    <!-- Theme Color & Mobile Optimization -->
    <meta name="theme-color" content="#e11d48" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="km" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Default SEO — overridden dynamically per page by react-helmet-async -->
    <title>OptaPOS Store — Official E-Commerce &amp; Retail Technology Cambodia</title>
    <meta name="title" content="OptaPOS Store — Official E-Commerce &amp; Retail Technology Cambodia" />
    <meta name="description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta name="keywords" content="OptaPOS Store, Cambodia E-Commerce, POS Hardware, Bakong KHQR, Laptops Phnom Penh, Smartphones Cambodia, Gaming Gear, Retail POS" />
    <meta name="author" content="OptaPOS Retail &amp; Technology" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://enterprise-customer-store.vercel.app" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OptaPOS Store" />
    <meta property="og:title" content="OptaPOS Store — Official E-Commerce &amp; Retail Technology Cambodia" />
    <meta property="og:description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta property="og:image" content="https://enterprise-customer-store.vercel.app/logo.png" />
    <meta property="og:url" content="https://enterprise-customer-store.vercel.app" />
    <meta property="og:locale" content="km_KH" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OptaPOS" />
    <meta name="twitter:title" content="OptaPOS Store — Official E-Commerce &amp; Retail Technology Cambodia" />
    <meta name="twitter:description" content="Shop authentic electronics, computers, smartphones, gaming gear, and enterprise POS hardware with fast nationwide delivery across Cambodia." />
    <meta name="twitter:image" content="https://enterprise-customer-store.vercel.app/logo.png" />

    <!-- Theme Color & Mobile Optimization -->
    <meta name="theme-color" content="#0066FF" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fallback Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "OptaPOS Store",
          "url": "https://enterprise-customer-store.vercel.app",
          "logo": "https://enterprise-customer-store.vercel.app/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+855-12-220-152",
            "contactType": "customer service",
            "areaServed": "KH",
            "availableLanguage": ["Khmer", "English", "Thai", "Vietnamese", "Chinese"]
          }
        },
        {
          "@type": "WebSite",
          "url": "https://enterprise-customer-store.vercel.app",
          "name": "OptaPOS Store",
          "inLanguage": ["km", "en", "th", "vi", "zh"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://enterprise-customer-store.vercel.app/products?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
